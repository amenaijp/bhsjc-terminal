# Development compose file. hot-reload, Caddy on localhost:5173, no TLS.
#
# Usage:
#   cp .env.example.dev .env
#   mkdir -p data/sqlite_db data/user_uploads
#   docker compose -f docker-compose.dev.yml up
#
# bhsjc-terminal is then available on localhost:5173, umami analytics is available on localhost:3000

services:
  umami-db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/${UMAMI_DB_NAME:-umami}
      COLLECT_API_ENDPOINT: /api/umamiSend
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    pull_policy: build # equivalent of running --build on every compose command
    command: bun run dev --host
    restart: unless-stopped
    expose:
      - '5173' # Vite dev server
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SQLITE_DATABASE_PATH: /data/sqlite_db/data.db
      USER_IMAGES_PATH: /data/user_uploads/
    depends_on:
      umami:
        condition: service_healthy
    volumes:
      - .:/app # hot reload appdata
      - ./data/sqlite_db:/data/sqlite_db
      - ./data/user_uploads:/data/user_uploads
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      ORIGIN: '${ORIGIN}' # host on the same url as in the .env
      UPSTREAM: 'app:5173' # no need to be modifiable
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/user_uploads:/data/user_uploads:ro
    networks:
      - internal
    depends_on:
      - app

volumes:
  umami-db-data:

networks:
  internal:
    driver: bridge
