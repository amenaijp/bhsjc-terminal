services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      SQLITE_DATABASE_PATH: /data/sqlite_db/data.db
      USER_IMAGES_PATH: /data/user_uploads/
    volumes:
      - db_data:/data/sqlite_db
      - user_uploads:/data/user_uploads
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ORIGIN: '${ORIGIN}'
      UPSTREAM: 'app:3000'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - user_uploads:/data/user_uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  user_uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
